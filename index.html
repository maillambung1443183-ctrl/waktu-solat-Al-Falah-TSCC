        // Format Tukar Masa AM/PM Ke 24-jam
        function convert12to24(timeStr) {
            if (!timeStr) return "00:00";
            const [time, modifier] = timeStr.trim().split(' ');
            let [hours, minutes] = time.split(':');
            let h = parseInt(hours, 10);
            if (modifier && modifier.toLowerCase() === 'pm' && h < 12) h += 12;
            if (modifier && modifier.toLowerCase() === 'am' && h === 12) h = 0;
            return `${String(h).padStart(2, '0')}:${minutes}`;

            "Jan": "01", "Feb": "02", "Mac": "03", "Apr": "04", 
            "Mei": "05", "Jun": "06", "Jul": "07", "Ogos": "08", 
            "Sep": "09", "Okt": "10", "Nov": "11", "Dis": "12"
        };

        // Pangkalan Data Lengkap 2027 & Fallback 2026
        const prayerScheduleDB = {};
        const hijriScheduleDB = {};

        // Parse Jadual 2027
        rawSchedule2027Data.forEach(row => {
            const [gDate, hDate, dayName, imsak, subuh, syuruk, zohor, asar, maghrib, isyak] = row.split('|');
            const [d, mStr, y] = gDate.split('-');
            const m = monthMapMY[mStr];
            const dateKey = `${y}-${m}-${d}`;

            prayerScheduleDB[dateKey] = {
                imsak: convert12to24(imsak),
                subuh: convert12to24(subuh),
                syuruk: convert12to24(syuruk),
                zohor: convert12to24(zohor),
                asar: convert12to24(asar),
                maghrib: convert12to24(maghrib),
                isyak: convert12to24(isyak)
            };
            hijriScheduleDB[dateKey] = hDate;
        });

        // Templat Data Asas Waktu Solat
        let prayerData = [
            { id: 'imsak', name: 'Imsak', arabic: 'الإمساك', time: '05:52', icon: 'fa-moon', hasIqamah: false },
            { id: 'subuh', name: 'Subuh', arabic: 'الفجر', time: '06:02', icon: 'fa-cloud-sun', hasIqamah: true },
            { id: 'syuruk', name: 'Syuruk', arabic: 'الشروق', time: '07:15', icon: 'fa-sun', hasIqamah: false },
            { id: 'zohor', name: 'Zohor', arabic: 'الظهر', time: '13:17', icon: 'fa-sun', hasIqamah: true },
            { id: 'asar', name: 'Asar', arabic: 'العصر', time: '16:40', icon: 'fa-cloud-sun', hasIqamah: true },
            { id: 'maghrib', name: 'Maghrib', arabic: 'المغرب', time: '19:15', icon: 'fa-cloud-moon', hasIqamah: true },
            { id: 'isyak', name: 'Isyak', arabic: 'العشاء', time: '20:30', icon: 'fa-moon', hasIqamah: true }
        ];

        // Kemaskini Waktu Solat Mengikut Tarikh Hari Ini
        function updateTodayPrayerTimes() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateKey = `${year}-${month}-${day}`;

            const todaySchedule = prayerScheduleDB[dateKey];
            if (todaySchedule) {
                prayerData.forEach(p => {
                    if (todaySchedule[p.id]) {
                        p.time = todaySchedule[p.id];
                    }
                });
            }

            // Kemaskini Hijri
            const hijriEl = document.getElementById('hijriDate');
            if (hijriEl && hijriScheduleDB[dateKey]) {
                hijriEl.innerText = hijriScheduleDB[dateKey];
            } else if (hijriEl) {
                hijriEl.innerText = "Zon Melaka MLK01";
            }
        }

        // Jam Masa Nyata
        function updateLiveClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString('ms-MY', { hour12: false });
            document.getElementById('liveClock').innerText = timeString;
        }

        // Formatkan Tarikh Biasa
        function updateDates() {
            const now = new Date();
            const options = { day: 'numeric', month: 'long', year: 'numeric' };
            const dateStr = now.toLocaleDateString('ms-MY', options);
            document.getElementById('currentDate').innerText = dateStr;
        }

        // Render senarai solat susunan melintang / responsive grid
        function renderPrayers() {
            const listEl = document.getElementById('prayerList');
            listEl.innerHTML = '';

            prayerData.forEach(p => {
                const card = document.createElement('div');
                card.id = `card-${p.id}`;
                card.className = `glass-card rounded-2xl p-2.5 sm:p-4 flex flex-row sm:flex-col justify-between items-center text-center transition-all duration-300 relative overflow-hidden min-h-[52px] sm:min-h-[150px] border border-slate-800`;
                
                let iqamahBadge = p.hasIqamah 
                    ? `<span id="iqamah-badge-${p.id}" class="text-[10px] sm:text-xs text-emerald-400 font-bold bg-emerald-500/20 px-2 py-0.5 rounded-lg border border-emerald-500/20"><i class="fa-regular fa-clock mr-1 hidden sm:inline"></i>+10m</span>` 
                    : `<span class="text-[10px] sm:text-xs text-slate-600 font-bold">-</span>`;

                card.innerHTML = `
                    <div class="flex items-center gap-2 sm:flex-col sm:gap-1">
                        <div class="w-7 h-7 sm:w-12 sm:h-12 rounded-xl bg-gradient-to-br from-emerald-500/20 to-teal-500/10 text-emerald-400 flex items-center justify-center text-xs sm:text-xl border border-emerald-500/20 shrink-0">
                            <i class="fa-solid ${p.icon}"></i>
                        </div>
                        <div class="text-left sm:text-center">
                            <div class="font-black text-xs sm:text-base lg:text-lg leading-tight text-slate-100">${p.name}</div>
                            <div class="arabic-font text-[10px] sm:text-xs text-amber-200/80 hidden sm:block">${p.arabic}</div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2 sm:flex-col sm:gap-1">
                        <div class="text-sm sm:text-xl xl:text-2xl font-black font-mono tracking-tight text-emerald-300">${p.time}</div>
                        ${iqamahBadge}
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        // Pengiraan Waktu & Countdown Solat / Iqamah
        function updatePrayerTracker() {
            const now = new Date();
            const currentMinutes = now.getHours() * 60 + now.getMinutes();

            let currentIqamahSolat = null;
            let iqamahSecondsRemaining = 0;

            for (let i = 0; i < prayerData.length; i++) {
                const p = prayerData[i];
                if (!p.hasIqamah) continue;

                const [h, m] = p.time.split(':').map(Number);
                const azanTime = new Date();
                azanTime.setHours(h, m, 0, 0);

                const iqamahTime = new Date(azanTime.getTime() + 10 * 60 * 1000); // 10 minit

                if (now >= azanTime && now < iqamahTime) {
                    currentIqamahSolat = p;
                    iqamahSecondsRemaining = Math.floor((iqamahTime - now) / 1000);
                    break;
                }
            }

            const pad = (num) => String(num).padStart(2, '0');
            const heroCard = document.getElementById('mainHeroCard');

            if (currentIqamahSolat) {
                // MOD IQAMAH BERJALAN (RED ALERT THEME UNTUK TV & MOBILE)
                heroCard.className = "lg:col-span-4 relative overflow-hidden rounded-xl sm:rounded-3xl p-3 sm:p-8 bg-gradient-to-br from-red-700 via-rose-800 to-red-950 text-white shadow-2xl flex flex-col justify-between min-h-[120px] sm:min-h-[300px] border-2 border-red-400 animate-pulse";
                
                document.getElementById('nextPrayerLabel').innerText = "IQAMAH " + currentIqamahSolat.name.toUpperCase();
                document.getElementById('nextPrayerName').innerText = currentIqamahSolat.name;
                document.getElementById('nextPrayerTime').innerText = currentIqamahSolat.time;
                document.getElementById('arabicPrayerName').innerText = "إقامة";
                document.getElementById('countdownLabel').innerText = "Masa Ke Iqamah:";

                const mins = Math.floor(iqamahSecondsRemaining / 60);
                const secs = iqamahSecondsRemaining % 60;
                document.getElementById('countdown').innerText = `00:${pad(mins)}:${pad(secs)}`;

                prayerData.forEach(p => {
                    const el = document.getElementById(`card-${p.id}`);
                    if (el) {
                        if (p.id === currentIqamahSolat.id) {
                            el.classList.add('active-prayer', 'iqamah-active-card');
                        } else {
                            el.classList.remove('active-prayer', 'iqamah-active-card');
                        }
                    }
                });

            } else {
                // MOD NORMAL (MENGIRA DETIK SOLAT SETERUSNYA)
                heroCard.className = "lg:col-span-4 relative overflow-hidden rounded-xl sm:rounded-3xl p-3 sm:p-8 bg-gradient-to-br from-emerald-600 via-teal-700 to-emerald-950 text-white shadow-2xl flex flex-col justify-between min-h-[120px] sm:min-h-[300px] border-2 border-emerald-400/30";
                
                document.getElementById('nextPrayerLabel').innerText = "Solat Seterusnya";
                document.getElementById('countdownLabel').innerText = "Mengira Detik:";

                let nextIndex = -1;
                const solatOnly = prayerData.filter(p => p.id !== 'imsak' && p.id !== 'syuruk');

                for (let i = 0; i < solatOnly.length; i++) {
                    const [h, m] = solatOnly[i].time.split(':').map(Number);
                    const prayerMinutes = h * 60 + m;

                    if (prayerMinutes > currentMinutes) {
                        nextIndex = prayerData.findIndex(p => p.id === solatOnly[i].id);
                        break;
                    }
                }

                if (nextIndex === -1) {
                    nextIndex = prayerData.findIndex(p => p.id === 'subuh');
                }

                const nextPrayer = prayerData[nextIndex];

                prayerData.forEach(p => {
                    const el = document.getElementById(`card-${p.id}`);
                    if (el) {
                        if (p.id === nextPrayer.id) {
                            el.classList.add('active-prayer');
                            el.classList.remove('iqamah-active-card');
                        } else {
                            el.classList.remove('active-prayer', 'iqamah-active-card');
                        }
                    }
                });

                document.getElementById('nextPrayerName').innerText = nextPrayer.name;
                document.getElementById('nextPrayerTime').innerText = nextPrayer.time;
                document.getElementById('arabicPrayerName').innerText = nextPrayer.arabic;

                const [nH, nM] = nextPrayer.time.split(':').map(Number);
                let targetDate = new Date();
                targetDate.setHours(nH, nM, 0, 0);

                if (targetDate <= now) {
                    targetDate.setDate(targetDate.getDate() + 1);
                }

                const diffMs = targetDate - now;
                const diffSec = Math.floor((diffMs / 1000) % 60);
                const diffMin = Math.floor((diffMs / (1000 * 60)) % 60);
                const diffHr = Math.floor((diffMs / (1000 * 60 * 60)) % 24);

                document.getElementById('countdown').innerText = `${pad(diffHr)}:${pad(diffMin)}:${pad(diffSec)}`;
            }
        }

        // Inisialisasi
        window.onload = () => {
            document.documentElement.classList.add('dark'); // Mod Gelap Tetap untuk Skrin TV
            updateTodayPrayerTimes();
            updateDates();
            renderPrayers();
            updatePrayerTracker();
            updateLiveClock();
            setInterval(() => {
                updateTodayPrayerTimes();
                updatePrayerTracker();
            }, 1000);
            setInterval(updateLiveClock, 1000);
        };
    </script>
</body>
</html>
